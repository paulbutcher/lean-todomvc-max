# Configuration for the OpenTelemetry collector that runs as a Lambda extension alongside the
# function. Selected by OPENTELEMETRY_COLLECTOR_CONFIG_URI; see template.yaml.
#
# The function reaches this over loopback, which is the whole reason it can speak plain HTTP with
# no TLS and no credentials of its own. Everything needed to reach the backend lives here.

receivers:
  otlp:
    protocols:
      # http only. The function speaks OTLP/JSON over HTTP and nothing else, so a gRPC listener
      # would be a port open for no one.
      http:
        endpoint: "localhost:4318"

processors:
  # Lambda freezes the execution environment the moment a response is returned, which would
  # otherwise strand whatever the collector had not yet sent. This holds the invocation open
  # until the pipeline has drained, and is the reason an in-process collector works here at all.
  decouple:

exporters:
  otlphttp:
    endpoint: ${env:TELEMETRY_ENDPOINT}
    headers:
      # Backends differ on what they call this. Honeycomb wants `x-honeycomb-team`, Grafana and
      # most OTLP-native endpoints want `authorization`. Change the key, not just the value.
      authorization: ${env:TELEMETRY_API_KEY}

service:
  # Both signals, because the application emits both: spans from `Telemetry.span` and log records
  # from the log functions. Metrics are absent because the library produces none.
  pipelines:
    traces:
      receivers: [otlp]
      processors: [decouple]
      exporters: [otlphttp]
    logs:
      receivers: [otlp]
      processors: [decouple]
      exporters: [otlphttp]
