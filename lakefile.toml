name = "todomvc"
version = "0.1.0"
defaultTargets = ["TodoMVC", "bootstrap", "Todo", "tests", "migrate", "logs"]
testDriver = "tests"

[leanOptions]
warningAsError = true

[[require]]
name = "awsLambda-http"
git = "https://github.com/paulbutcher/lean-aws-lambda"
rev = "v0.4.0"
subDir = "http"

[[require]]
name = "leanpostgres"
git = "https://github.com/paulbutcher/leanpostgres"
rev = "v0.7.2"

[[require]]
name = "telemetry"
git = "https://github.com/paulbutcher/lean-telemetry"
rev = "v0.5.0"

[[require]]
name = "html"
git = "https://github.com/paulbutcher/lean-html"
rev = "v0.9.0"

[[require]]
name = "markdown"
git = "https://github.com/paulbutcher/lean-markdown"
rev = "v0.7.1"

[[require]]
name = "LLMClient"
git = "https://github.com/paulbutcher/lean-llmclient"
rev = "v0.8.1"

[[require]]
name = "MCP"
git = "https://github.com/paulbutcher/lean-mcp"
rev = "v0.2.0"

[[require]]
name = "leancrypto"
git = "https://github.com/paulbutcher/leancrypto"
rev = "v0.3.1"

[[require]]
name = "htmx"
git = "https://github.com/paulbutcher/lean-htmx"
rev = "v0.6.1"

[[require]]
name = "routing"
git = "https://github.com/paulbutcher/lean-routing"
rev = "v0.7.1"

[[require]]
name = "middleware"
git = "https://github.com/paulbutcher/lean-middleware"
rev = "v0.13.0"

[[require]]
name = "authentication"
git = "https://github.com/paulbutcher/lean-authentication"
rev = "v0.14.1"

[[require]]
name = "leanmigratePostgres"
git = "https://github.com/paulbutcher/leanmigrate"
rev = "v0.5.1"
subDir = "postgres"

[[require]]
name = "middleware-cookiestore"
git = "https://github.com/paulbutcher/lean-middleware"
rev = "v0.13.0"
subDir = "cookiestore"

[[require]]
name = "middleware-tracing"
git = "https://github.com/paulbutcher/lean-middleware"
rev = "v0.13.0"
subDir = "tracing"

[[lean_lib]]
name = "Todo"

[[lean_lib]]
name = "TodoTests"

# `LogsMain` is the executable; this is what it renders with, kept apart so the test suite can
# reach it, the same split as `Todo` and `Main`.
[[lean_lib]]
name = "Logs"
srcDir = "dev"

[[lean_exe]]
name = "tests"
root = "TodoTests"

[[lean_exe]]
name = "migrate"
srcDir = "dev"
root = "Migrate"

[[lean_exe]]
name = "logs"
srcDir = "dev"
root = "LogsMain"

[[lean_exe]]
name = "TodoMVC"
root = "Main"

[[lean_exe]]
name = "bootstrap"
root = "LambdaMain"
