AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: TodoMVC in Lean, on a Lambda function URL backed by RDS Postgres.

Parameters:
  FunctionMemory:
    Type: Number
    Default: 1024
    Description: >-
      A parameter rather than a literal because the telemetry resource reports it as
      `faas.max_memory`, and a second copy of the number would be free to drift from the first.

  BaseUrl:
    Type: String
    Default: ""
    Description: >-
      The origin a sign-in link points back at, which is this function's own URL. It cannot be
      read from the function URL resource here: that resource depends on the function, so the
      function's environment depending on it in turn is a cycle CloudFormation refuses. Deploy
      once with this empty, read `Endpoint` from the outputs, and deploy again with it set.
      Sign-in is refused until it is. A trailing slash, which is how that output is published, is
      trimmed rather than concatenated into a link that would then 404.

  MailFrom:
    Type: String
    Description: >-
      The address sign-in mail is sent from. Its domain needs SPF, DKIM, DMARC and an MX record
      (a null MX will do) before mail is delivered rather than filed as spam.

  PepperKeyId:
    Type: String
    Default: "1"
    Description: >-
      Names the pepper that digested a credential, and is recorded alongside each one. Change it
      whenever the pepper secret changes, or the record of which key was used stops being true.

Resources:
  # Both the function and the database sit in this VPC so the database needs no public address.
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      # Both are needed before an interface endpoint's private DNS resolves, and a VPC that is not
      # the default one has hostnames off. Without them `email.<region>.amazonaws.com` keeps
      # resolving to the public address, which nothing in here can reach.
      EnableDnsSupport: true
      EnableDnsHostnames: true

  # RDS insists on subnets in two availability zones even for a single-AZ instance.
  Subnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]

  Subnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "Security group for ${AWS::StackName}"
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: !GetAtt VPC.CidrBlock

  # How the function reaches SES. This stack has no internet gateway and no NAT gateway, so an
  # interface endpoint is not the cheaper of two ways out here; it is the way that does not mean
  # building a public egress path, and paying a standing charge for it, to carry one API call per
  # sign-in. The traffic never leaves the AWS network either way.
  #
  # If the stack fails to create this, the two things to check are that SES publishes an API
  # endpoint in the region:
  #
  #   aws ec2 describe-vpc-endpoint-services \
  #     --filters Name=service-name,Values=com.amazonaws.<region>.email
  #
  # and that both subnets are in availability zones it serves. Either way it fails while
  # deploying rather than at the first sign-in, which is the failure worth having.
  SesEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "SES interface endpoint for ${AWS::StackName}"
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !GetAtt VPC.CidrBlock

  SesEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.email"
      VpcEndpointType: Interface
      # What makes the hostname the signed request already names resolve here, so nothing in the
      # application knows the difference.
      PrivateDnsEnabled: true
      SubnetIds: [!Ref Subnet1, !Ref Subnet2]
      SecurityGroupIds: [!Ref SesEndpointSecurityGroup]

  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "Subnet group for ${AWS::StackName}"
      SubnetIds: [!Ref Subnet1, !Ref Subnet2]

  DatabaseKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub "Storage encryption key for ${AWS::StackName}"
      EnableKeyRotation: false
      KeyPolicy:
        Version: "2012-10-17"
        Id: !Sub "key-${AWS::StackName}"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: ["kms:*"]
            Resource: "*"

  Database:
    Type: AWS::RDS::DBInstance
    # CloudFormation's default for a database instance, spelled out rather than left implicit:
    # deleting the stack takes a final snapshot instead of taking the data with it.
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceClass: db.t4g.micro
      Engine: postgres
      # Major version only, so RDS picks a minor version it actually offers. 18 matches both the
      # Postgres the test suite runs against and the libpq the image links.
      EngineVersion: "18"
      DBName: todomvc
      AllocatedStorage: 20
      StorageEncrypted: true
      KmsKeyId: !Ref DatabaseKey
      # RDS generates the password and keeps it in a Secrets Manager secret of its own.
      ManageMasterUserPassword: true
      MasterUsername: postgres
      VPCSecurityGroups: [!Ref SecurityGroup]
      DBSubnetGroupName: !Ref DBSubnetGroup

  # Sessions are sealed rather than stored, so the key has to outlive any one execution
  # environment and be identical across all of them.
  SessionKey:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: !Sub "Session sealing key for ${AWS::StackName}"
      GenerateSecretString:
        # 64 characters confined to [0-9a-f], which decode to the 32 bytes AES-256 needs.
        PasswordLength: 64
        ExcludeUppercase: true
        ExcludePunctuation: true
        ExcludeCharacters: "ghijklmnopqrstuvwxyz"

  # The authentication library stores no credential, only an HMAC of one under this key. It has
  # the same standing as the session key above and one more consequence: replacing it without
  # keeping the old one alongside signs everyone out and voids every link in flight.
  AuthPepper:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: !Sub "Credential pepper for ${AWS::StackName}"
      GenerateSecretString:
        PasswordLength: 64
        ExcludeUppercase: true
        ExcludePunctuation: true
        ExcludeCharacters: "ghijklmnopqrstuvwxyz"

  Function:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Architectures: [arm64]
      MemorySize: !Ref FunctionMemory
      Timeout: 20
      # Every warm instance holds a Postgres connection open, and db.t4g.micro allows on the
      # order of a hundred in total.
      ReservedConcurrentExecutions: 20
      FunctionUrlConfig:
        AuthType: NONE
      VpcConfig:
        SecurityGroupIds: [!Ref SecurityGroup]
        SubnetIds: [!Ref Subnet1, !Ref Subnet2]
      Policies:
        - AWSLambdaVPCAccessExecutionRole
        # Any identity in this account and region rather than the one `MailFrom` names, because
        # the identity behind an address may be the address or its domain, and naming the wrong
        # one gives a stack that deploys and then refuses the first sign-in.
        - Statement:
            - Effect: Allow
              Action: [ses:SendEmail]
              Resource: !Sub "arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/*"
      Environment:
        Variables:
          # `Postgres.open ""` passes an empty connection string to libpq, which then reads all
          # of these itself. Nothing in the application needs to know where they came from.
          PGHOST: !GetAtt Database.Endpoint.Address
          PGPORT: !Sub "${Database.Endpoint.Port}"
          PGDATABASE: todomvc
          PGUSER: postgres
          PGPASSWORD: !Sub "{{resolve:secretsmanager:${Database.MasterUserSecret.SecretArn}:SecretString:password}}"
          # libpq defaults to `prefer`, which falls back to an unencrypted connection without
          # complaint. `verify-full` would additionally need the RDS CA bundle in the image.
          PGSSLMODE: require
          SESSION_KEY: !Sub "{{resolve:secretsmanager:${SessionKey}:SecretString}}"
          AUTH_PEPPER: !Sub "{{resolve:secretsmanager:${AuthPepper}:SecretString}}"
          AUTH_PEPPER_KEY_ID: !Ref PepperKeyId
          BASE_URL: !Ref BaseUrl
          MAIL_FROM: !Ref MailFrom
          OTEL_SERVICE_NAME: todomvc
          # Telemetry leaves as JSON on stdout, which the runtime forwards to CloudWatch Logs.
          # That path belongs to the Lambda service rather than to this function's network
          # interface, so it is the one way out of a VPC with no egress, and it is why there is no
          # collector here. Reaching anything beyond CloudWatch is a subscription filter's job,
          # and that also runs outside this VPC.
          #
          # `flat_json` rather than `otlp_json` because Logs Insights has to be able to address a
          # field, and an OTLP envelope buries an attribute at an index that varies per span and
          # states the resource once per batch rather than on the row. One self-contained object
          # per span is the difference between a log group that can be queried like a trace store
          # and one that is a transcript.
          #
          # Giving stdout to the machine costs the readable format. `lake exe logs` renders it
          # back for a terminal, and a developer running locally sets none of this and has it
          # directly.
          OTEL_TRACES_EXPORTER: console
          OTEL_LOGS_EXPORTER: console
          OTEL_EXPORTER_CONSOLE_FORMAT: flat_json
          # What is settled at deployment. `faas.instance` is not, and the function supplies it
          # itself; see `LambdaMain.instanceAttrs`. `host.name` goes undetected either way, since
          # Lambda sets no `HOSTNAME`.
          OTEL_RESOURCE_ATTRIBUTES: !Sub
            - "cloud.provider=aws,cloud.platform=aws_lambda,cloud.region=${AWS::Region},faas.name=${Name},faas.max_memory=${Memory}"
            - Name: !Sub "${AWS::StackName}"
              Memory: !Ref FunctionMemory
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: .
      DockerTag: latest

Outputs:
  Endpoint:
    Description: Public URL of the application.
    Value: !GetAtt FunctionUrl.FunctionUrl
